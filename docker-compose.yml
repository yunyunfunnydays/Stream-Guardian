version: "3.9"

services:
  # Java Service: MCP Server (SSE) + WebSocket Ingest
  java-service:
    build:
      context: ./java-service
      dockerfile: Dockerfile
    container_name: stream-guardian-java
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Taipei
      - SPRING_PROFILES_ACTIVE=docker
      - PYTHON_SERVICE_URL=http://python-service:8000
    depends_on:
      - qdrant
    networks:
      - stream-guardian-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/mcp/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    develop:
      watch:
        - action: rebuild
          path: ./java-service/pom.xml
        - action: rebuild
          path: ./java-service/src

  # Python Service: MCP Client + LangGraph AI Brain
  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: stream-guardian-python
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Taipei
      - JAVA_SERVICE_URL=http://java-service:8080
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - LOG_LEVEL=INFO
      # LangSmith Observability
      - LANGSMITH_TRACING=true
      - LANGSMITH_ENDPOINT=https://api.smith.langchain.com
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=stream-guardian
    depends_on:
      java-service:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - stream-guardian-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    develop:
      watch:
        - action: sync+restart
          path: ./python-service/app
          target: /app/app

  # Qdrant: Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: stream-guardian-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - stream-guardian-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  stream-guardian-network:
    driver: bridge

volumes:
  qdrant_data:
