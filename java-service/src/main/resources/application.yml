server:
  port: 8080

spring:
  application:
    name: stream-guardian-java-service
  jackson:
    property-naming-strategy: SNAKE_CASE

# Python service URL for forwarding messages
python-service:
  url: http://python-service:8000

logging:
  level:
    root: INFO
    com.streamguardian: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
